name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: C++ / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: GCC Linux
          - os: windows-latest
            label: MSVC Windows

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Enable the MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure with strict warnings
        run: cmake --preset debug -DAEROGUARD_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset debug

      - name: Run native tests
        run: ctest --preset debug --output-on-failure

      - name: Generate replay artifacts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p demo-output
          ./build/debug/aeroguard \
            --export-all demo-output \
            --scenarios-dir scenarios \
            --seed 42

      - name: Upload native build
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: |
            build/debug/aeroguard*
            !build/debug/aeroguard*.dir
          if-no-files-found: error

      - name: Upload generated replay data
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: simulator-replays
          path: demo-output/
          if-no-files-found: error

  sanitizers:
    name: C++ / ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Configure sanitizer build
        run: cmake --preset sanitizers -DAEROGUARD_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset sanitizers

      - name: Run native tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --preset sanitizers --output-on-failure

  static-analysis:
    name: C++ / clang-tidy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-tidy

      - name: Configure analysis build
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake --preset debug
          -DAEROGUARD_BUILD_TESTS=OFF
          -DAEROGUARD_ENABLE_CLANG_TIDY=ON
          -DAEROGUARD_WARNINGS_AS_ERRORS=ON

      - name: Run clang-tidy during compilation
        run: cmake --build --preset debug

  frontend:
    name: Frontend / lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test -- --run

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build dashboard
        run: npm run build

      - name: Upload dashboard bundle
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: frontend/dist/
          if-no-files-found: error

  backend:
    name: API / build + integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore locked project dependencies
        run: dotnet restore backend/AeroGuard.Backend.sln

      - name: Build with release settings
        run: dotnet build backend/AeroGuard.Backend.sln --configuration Release --no-restore

      - name: Run API integration tests
        run: dotnet test backend/AeroGuard.Backend.sln --configuration Release --no-build --logger "trx;LogFileName=backend-tests.trx"

      - name: Check package vulnerabilities
        run: dotnet list backend/AeroGuard.Backend.sln package --vulnerable --include-transitive

      - name: Upload API test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/**/TestResults/backend-tests.trx
          if-no-files-found: warn

  docker:
    name: Docker stack smoke test
    runs-on: ubuntu-latest
    needs: [cpp, frontend, backend]
    env:
      AEROGUARD_ADMIN_PASSWORD: Ci-Only-Admin-Password-42!
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build API and dashboard images
        run: docker compose build api dashboard

      - name: Start and probe the stack
        shell: bash
        run: |
          docker compose up --detach api dashboard
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null \
              && curl --fail --silent http://127.0.0.1:8080/api/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8081/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs api dashboard
          exit 1

      - name: Stop smoke-test stack
        if: always()
        run: docker compose down --volumes
