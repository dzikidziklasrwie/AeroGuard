name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: C++ / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: GCC Linux
          - os: windows-latest
            label: MSVC Windows

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure, build, and test with MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswherePath = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installationPath = & $vswherePath `
            -latest `
            -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $installationPath) {
            throw 'A Visual Studio installation with the C++ toolchain was not found.'
          }
          Import-Module (Join-Path $installationPath 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell `
            -VsInstallPath $installationPath `
            -SkipAutomaticLocation `
            -DevCmdArguments '-arch=x64 -host_arch=x64'
          cmake --preset debug -DAEROGUARD_WARNINGS_AS_ERRORS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --preset debug --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure with strict warnings
        if: runner.os != 'Windows'
        run: cmake --preset debug -DAEROGUARD_WARNINGS_AS_ERRORS=ON

      - name: Build
        if: runner.os != 'Windows'
        run: cmake --build --preset debug

      - name: Run native tests
        if: runner.os != 'Windows'
        run: ctest --preset debug --output-on-failure

      - name: Generate replay artifacts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p demo-output
          ./build/debug/aeroguard \
            --export-all demo-output \
            --scenarios-dir scenarios \
            --seed 42

      - name: Upload native build
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.os }}
          path: |
            build/debug/aeroguard*
            !build/debug/aeroguard*.dir
          if-no-files-found: error

      - name: Upload generated replay data
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: simulator-replays
          path: demo-output/
          if-no-files-found: error

  sanitizers:
    name: C++ / ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure sanitizer build
        run: cmake --preset sanitizers -DAEROGUARD_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset sanitizers

      - name: Run native tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --preset sanitizers --output-on-failure

  static-analysis:
    name: C++ / clang-tidy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-tidy

      - name: Configure analysis build
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake --preset debug
          -DAEROGUARD_BUILD_TESTS=OFF
          -DAEROGUARD_ENABLE_CLANG_TIDY=ON
          -DAEROGUARD_WARNINGS_AS_ERRORS=ON

      - name: Run clang-tidy during compilation
        run: cmake --build --preset debug

  frontend:
    name: Frontend / lint + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test -- --run

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build dashboard
        run: npm run build

      - name: Upload dashboard bundle
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-dist
          path: frontend/dist/
          if-no-files-found: error

  backend:
    name: API / build + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore project dependencies
        run: dotnet restore backend/AeroGuard.Backend.sln

      - name: Build with release settings
        run: dotnet build backend/AeroGuard.Backend.sln --configuration Release --no-restore

      - name: Run API integration tests
        run: dotnet test backend/AeroGuard.Backend.sln --configuration Release --no-build --logger "trx;LogFileName=backend-tests.trx"

      - name: Check package vulnerabilities
        run: dotnet list backend/AeroGuard.Backend.sln package --vulnerable --include-transitive

      - name: Upload API test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: backend/**/TestResults/backend-tests.trx
          if-no-files-found: warn

  docker:
    name: Docker stack smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [cpp, frontend, backend]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Generate smoke-test password
        shell: bash
        run: |
          admin_password="$(openssl rand -hex 24)"
          echo "::add-mask::$admin_password"
          echo "AEROGUARD_ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build API and dashboard images
        run: docker compose build api dashboard

      - name: Start and probe the stack
        shell: bash
        run: |
          docker compose up --detach api dashboard
          ready=false
          for _ in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null \
              && curl --fail --silent http://127.0.0.1:8080/api/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:8081/api/health >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != "true" ]]; then
            docker compose ps
            docker compose logs api dashboard
            exit 1
          fi

          replay_headers="$(curl --fail --silent --show-error \
            --dump-header - \
            --output /dev/null \
            --header 'Accept-Encoding: gzip' \
            http://127.0.0.1:8080/data/normal-operation.jsonl)"
          replay_headers="${replay_headers//$'\r'/}"
          grep --quiet --ignore-case '^Content-Type: application/x-ndjson' <<<"$replay_headers"
          grep --quiet --ignore-case '^Content-Encoding: gzip$' <<<"$replay_headers"
          replay_etag="$(awk -F': ' 'tolower($1) == "etag" { print $2; exit }' <<<"$replay_headers")"
          test -n "$replay_etag"
          replay_status="$(curl --silent --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            --header 'Accept-Encoding: gzip' \
            --header "If-None-Match: $replay_etag" \
            http://127.0.0.1:8080/data/normal-operation.jsonl)"
          test "$replay_status" = '304'

          manifest_headers="$(curl --fail --silent --show-error \
            --dump-header - \
            --output /dev/null \
            http://127.0.0.1:8080/data/manifest.json)"
          manifest_headers="${manifest_headers//$'\r'/}"
          grep --quiet --ignore-case '^Content-Type: application/json' <<<"$manifest_headers"

          login_payload="$(python3 -c \
            'import json, os; print(json.dumps({"username": "admin", "password": os.environ["AEROGUARD_ADMIN_PASSWORD"]}))')"
          login_response="$(curl --fail --silent \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$login_payload" \
            http://127.0.0.1:8080/api/auth/login)"
          access_token="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' \
            <<<"$login_response")"
          test -n "$access_token"
          curl --fail --silent \
            --header "Authorization: Bearer $access_token" \
            http://127.0.0.1:8080/api/operations/flights >/dev/null
          curl --fail --silent \
            --request POST \
            --header "Authorization: Bearer $access_token" \
            'http://127.0.0.1:8080/hubs/operations/negotiate?negotiateVersion=1' >/dev/null

      - name: Stop smoke-test stack
        if: always()
        run: docker compose down --volumes
